    <h2>Przykłady selektorów i stylów</h2>
    
    <p class="selektor-p">To jest akapit z klasą .selektor-p</p>
    <p id="selektor-id">To jest akapit z ID #selektor-id</p>
    
    <div class="ramka">Element DIV z ramką i tłem</div>
    
    <p><strong>Selektor potomka:</strong> <span class="dziecko">to jest dziecko</span></p>

    <h2>KOD CSS - Zadanie 66</h2>
    <textarea rows="20" cols="80" readonly>
/* Trzaskalski Z66_html */

/* Selektor typu */
body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f0f0f0;
    color: #333;
    margin: 20px;
    line-height: 1.6;
}

h1 {
    color: #0066cc;
    text-align: center;
    font-size: 28px;
}

/* Selektor klasy */
.selektor-p {
    color: #d35400;
    font-size: 18px;
    font-weight: bold;
}

/* Selektor ID */
#selektor-id {
    color: #27ae60;
    background-color: #e8f8e8;
    padding: 10px;
    border-left: 5px solid #27ae60;
}

/* Selektor atrybutu + pseudoklasa */
.ramka {
    border: 2px solid #8e44ad;
    background-color: white;
    padding: 15px;
    margin: 15px 0;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

/* Selektor potomka */
p strong span.dziecko {
    color: #e74c3c;
    font-style: italic;
}

/* Pseudoklasy */
a:hover {
    color: #ff0000;
    text-decoration: underline;
}
